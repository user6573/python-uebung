name: CI

# die 3 ausloeser laut angabe: push, zeitgesteuert und manuell
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # jeden montag um 6 uhr frueh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Syntax checken (compileall)
        run: python -m compileall .

      - name: Tests ausfuehren
        run: python -m unittest discover -v

      - name: Linting mit ruff
        run: ruff check .
        continue-on-error: true   # soll den build nicht abbrechen, nur anzeigen

      - name: Security Check mit bandit
        run: bandit -r . -ll
        continue-on-error: true

      - name: Schwachstellen in Paketen pruefen (pip-audit)
        run: pip-audit -r requirements.txt -f json -o audit.json
        continue-on-error: true

      - name: Audit Report hochladen
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit.json
